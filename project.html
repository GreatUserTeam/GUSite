<!DOCTYPE html>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { scrollbar-width: none; -ms-overflow-style: none; }
    ::-webkit-scrollbar { display: none; }
    body { background: #0b0b0b; color: #f0f0f0; font-family: "Inter", system-ui, -apple-system, sans-serif; min-height: 100vh; transition: background .3s, color .3s; overflow-x: hidden; }
    body.light { background: #fff; color: #000; }
    .header { position: fixed; top: 0; left: 0; width: 100%; z-index: 50; padding: 16px 24px; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); background: rgba(11,11,11,.8); border-bottom: 1px solid rgba(255,255,255,.1); transition: all .3s; }
    body.light .header { background: rgba(255,255,255,.9); border-bottom-color: rgba(0,0,0,.1); }
    .header-inner { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
    .brand-logo { display: flex; align-items: center; font-size: 26px; font-weight: 800; letter-spacing: -.02em; text-decoration: none; color: #fff; }
    body.light .brand-logo { color: #000; }
    .brand-g { height: .85em; width: auto; margin-right: -2px; transform: translateY(1px); }
    .svg-white { fill: #fff; transition: fill .3s; }
    body.light .svg-white { fill: #000; }
    .brand-t { color: #ff4d30; margin-left: 2px; }
    .settings-widget { position: relative; border-radius: 9999px; height: 40px; width: 40px; transition: width .3s cubic-bezier(.4,0,.2,1); display: flex; align-items: center; justify-content: center; overflow: hidden; border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.05); }
    body.light .settings-widget { border-color: rgba(0,0,0,.1); background: rgba(0,0,0,.05); }
    .settings-widget.open { width: 104px; }
    .settings-trigger { position: absolute; right: 0; top: 0; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; background: none; border: none; cursor: pointer; color: inherit; transition: transform .3s, opacity .2s; z-index: 10; }
    .settings-trigger:hover { color: #ff4d30; }
    .settings-widget.open .settings-trigger { opacity: 0; pointer-events: none; transform: rotate(90deg); }
    .settings-menu { display: flex; align-items: center; justify-content: space-around; width: 100%; padding: 0 4px; opacity: 0; transform: scale(.9); pointer-events: none; transition: all .25s; }
    .settings-widget.open .settings-menu { opacity: 1; transform: scale(1); pointer-events: auto; }
    .settings-btn { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: none; border: none; cursor: pointer; font-weight: 700; font-size: 12px; color: inherit; transition: all .2s; }
    .settings-btn:hover { background: rgba(255,77,48,.15); color: #ff4d30; }
    .wrapper { max-width: 1200px; margin: 0 auto; padding: 112px 16px 64px; }
    @media (min-width: 768px) { .wrapper { padding-left: 32px; padding-right: 32px; } }
    .hero { display: flex; flex-direction: column; align-items: center; text-align: center; margin-top: 16px; margin-bottom: 32px; }
    .hero-title { font-size: clamp(34px, 5.5vw, 64px); font-weight: 800; letter-spacing: -.03em; line-height: 1.1; display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 4px; }
    .title-g { height: .9em; width: auto; margin-right: -4px; vertical-align: middle; }
    .highlight-system { color: #ff4d30; }
    .hero-motto { display: inline-flex; align-items: center; gap: 10px; padding: 12px 28px; margin-top: 20px; border-radius: 9999px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.8px; text-decoration: none; border: 1px solid rgba(255,77,48,.25); background: rgba(255,77,48,.1); color: #ff4d30; transition: all .2s; }
    body.light .hero-motto { background: rgba(0,0,0,.05); border-color: rgba(0,0,0,.15); }
    .hero-motto:hover { background: rgba(255,77,48,.2); }
    .hero-desc { margin-top: 16px; font-size: clamp(16px, 2.2vw, 19.5px); line-height: 1.6; max-width: 800px; text-align: center; color: rgba(255,255,255,.65); }
    body.light .hero-desc { color: rgba(0,0,0,.75); }
    .tabs-nav { width: 100%; max-width: 900px; margin: 0 auto 32px; display: flex; border-bottom: 1px solid rgba(255,255,255,.1); }
    body.light .tabs-nav { border-bottom-color: rgba(0,0,0,.1); }
    .tab-btn { position: relative; flex: 1; padding: 14px 4px; font-size: clamp(13px, 3.3vw, 15.5px); font-weight: 600; background: none; border: none; cursor: pointer; text-align: center; white-space: nowrap; color: rgba(255,255,255,.6); transition: color .2s; }
    body.light .tab-btn { color: rgba(0,0,0,.6); }
    .tab-btn:hover, .tab-btn.active { color: #fff; }
    body.light .tab-btn:hover, body.light .tab-btn.active { color: #000; }
    .tab-btn.active { font-weight: 700; }
    .tab-indicator { position: absolute; bottom: -1px; left: 50%; transform: translateX(-50%); width: 80%; height: 2.5px; background: #ff4d30; border-radius: 2px 2px 0 0; display: none; }
    @media (min-width: 640px) { .tab-indicator { width: 60%; } }
    .tab-btn.active .tab-indicator { display: block; }
    .tab-pane { display: none; animation: fadeIn .3s ease forwards; }
    .tab-pane.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .section-header { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 20px; }
    .section-header-icon { width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: #ff4d30; }
    .section-header-title { font-size: clamp(24px, 4vw, 28px); font-weight: 700; letter-spacing: -.02em; }
    .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; max-width: 900px; margin: 0 auto 32px; width: 100%; }
    @media (min-width: 640px) { .stats-grid { grid-template-columns: repeat(3, 1fr); gap: 16px; } }
    .stat-tile { border: 1px solid rgba(255,255,255,.08); background: rgba(255,255,255,.03); border-radius: 16px; padding: 20px 16px; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    body.light .stat-tile { border-color: rgba(0,0,0,.1); background: rgba(0,0,0,.03); box-shadow: 0 1px 3px rgba(0,0,0,.05); }
    .stat-tile.featured-mobile { grid-column: span 2; }
    @media (min-width: 640px) { .stat-tile.featured-mobile { grid-column: span 1; } }
    .stat-value { font-size: 36px; font-weight: 800; color: #ff4d30; margin-bottom: 6px; line-height: 1; }
    @media (min-width: 640px) { .stat-value { font-size: 32px; } }
    .stat-label { font-size: 12px; font-weight: 500; color: rgba(255,255,255,.5); }
    body.light .stat-label { color: rgba(0,0,0,.6); }
    .about-text-box { max-width: 900px; margin: 0 auto 24px; display: flex; flex-direction: column; gap: 16px; font-size: clamp(16px, 1.8vw, 17px); line-height: 1.7; color: rgba(255,255,255,.75); text-align: left; }
    body.light .about-text-box { color: rgba(0,0,0,.8); }
    .actions-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 24px; }
    .btn-pill { padding: 12px 24px; border-radius: 9999px; font-size: 14px; font-weight: 700; cursor: pointer; transition: all .2s; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; border: 1px solid transparent; }
    .btn-pill-primary { background: #ff4d30; color: #fff; box-shadow: 0 4px 16px rgba(255,77,48,.25); }
    .btn-pill-primary:hover { background: #e0442b; transform: translateY(-2px); }
    .btn-pill-secondary { border-color: rgba(255,255,255,.2); color: inherit; background: transparent; }
    body.light .btn-pill-secondary { border-color: rgba(0,0,0,.2); }
    .btn-pill-secondary:hover { border-color: #ff4d30; color: #ff4d30; background: rgba(255,77,48,.05); transform: translateY(-2px); }

    /* Photos Section (чистые карточки без подписей) */
    .photos-grid { display: grid; grid-template-columns: 1fr; gap: 20px; max-width: 1000px; margin: 0 auto; }
    @media (min-width: 640px) { .photos-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 1024px) { .photos-grid { grid-template-columns: repeat(3, 1fr); } }
    .photo-card { position: relative; border-radius: 16px; overflow: hidden; aspect-ratio: 4/3; border: 1px solid rgba(255,255,255,.08); background: rgba(255,255,255,.03); cursor: pointer; transition: all .3s; }
    body.light .photo-card { border-color: rgba(0,0,0,.1); background: rgba(0,0,0,.02); }
    .photo-card:hover { border-color: #ff4d30; transform: scale(1.02); box-shadow: 0 12px 30px rgba(0,0,0,.4); }
    .photo-card img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .5s; }
    .photo-card:hover img { transform: scale(1.06); }
    .photo-overlay { position: absolute; inset: 0; background: rgba(0,0,0,.3); display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity .25s; }
    .photo-card:hover .photo-overlay { opacity: 1; }
    .photo-maximize-icon { color: #fff; transform: scale(.9); transition: transform .25s; filter: drop-shadow(0 2px 8px rgba(0,0,0,.6)); }
    .photo-card:hover .photo-maximize-icon { transform: scale(1.1); }

    .media-error-box { max-width: 500px; margin: 40px auto; padding: 36px 24px; border-radius: 20px; border: 1px dashed rgba(255,77,48,.4); background: rgba(255,77,48,.05); text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: #ff4d30; }
    body.light .media-error-box { border-color: rgba(255,77,48,.3); background: rgba(255,77,48,.04); }
    .media-error-text { font-size: 16px; font-weight: 600; color: inherit; }

    .lightbox-modal { position: fixed; inset: 0; background: rgba(0,0,0,.95); z-index: 100; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px; cursor: zoom-out; animation: fadeIn .2s forwards; }
    .lightbox-modal.active { display: flex; }
    .lightbox-close-btn { position: absolute; top: 20px; right: 20px; width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,.1); color: #fff; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all .2s; z-index: 10; }
    .lightbox-close-btn:hover { background: #ff4d30; transform: rotate(90deg); }
    .lightbox-img { max-width: 90%; max-height: 85vh; border-radius: 12px; object-fit: contain; cursor: zoom-in; transition: transform .3s; }
    .lightbox-img.zoomed { transform: scale(1.5); cursor: zoom-out; }

    .filter-card { max-width: 760px; margin: 0 auto 32px; border: 1px solid rgba(255,255,255,.08); background: rgba(255,255,255,.02); backdrop-filter: blur(12px); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
    body.light .filter-card { border-color: rgba(0,0,0,.1); background: rgba(0,0,0,.02); box-shadow: 0 1px 3px rgba(0,0,0,.05); }
    .filter-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .filter-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; width: 110px; flex-shrink: 0; color: rgba(255,255,255,.4); }
    body.light .filter-title { color: rgba(0,0,0,.5); }
    .filter-buttons-group { display: flex; gap: 8px; flex-wrap: wrap; flex: 1; }
    .filter-btn { position: relative; padding: 8px 16px; border-radius: 9999px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all .2s; border: 1px solid rgba(255,255,255,.08); background: rgba(255,255,255,.04); color: rgba(255,255,255,.7); }
    body.light .filter-btn { border-color: rgba(0,0,0,.15); background: rgba(0,0,0,.05); color: rgba(0,0,0,.8); }
    .filter-btn:hover { border-color: #ff4d30; color: #ff4d30; }
    .filter-btn.active { background: #ff4d30 !important; border-color: #ff4d30 !important; color: #fff !important; box-shadow: 0 4px 14px rgba(255,77,48,.3); }
    .blue-indicator-dot { position: absolute; top: -2px; right: -2px; width: 8px; height: 8px; background: #0088ff; border-radius: 50%; box-shadow: 0 0 8px #0088ff; pointer-events: none; }
    .releases-container { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
    .release-item-card { border: 2px solid rgba(255,255,255,.1); background: #0a0a0a; border-radius: 24px; padding: 24px; box-shadow: 0 16px 36px rgba(0,0,0,.4); transition: border-color .3s; }
    @media (min-width: 640px) { .release-item-card { padding: 28px; } }
    body.light .release-item-card { border-color: rgba(0,0,0,.1); background: #fff; box-shadow: 0 16px 36px rgba(0,0,0,.05); }
    .release-item-card:hover { border-color: rgba(255,77,48,.5); }
    .release-top-bar { display: flex; flex-direction: column; gap: 12px; padding-bottom: 16px; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,.1); }
    @media (min-width: 640px) { .release-top-bar { flex-direction: row; align-items: center; justify-content: space-between; } }
    body.light .release-top-bar { border-bottom-color: rgba(0,0,0,.1); }
    .tag-badge { padding: 4px 12px; font-size: 12px; font-weight: 700; background: rgba(255,77,48,.1); color: #ff4d30; border: 1px solid rgba(255,77,48,.25); border-radius: 9999px; align-self: flex-start; }
    .release-main-title { font-size: clamp(18px, 2.5vw, 20px); font-weight: 800; color: inherit; }
    .release-date-text { font-size: 13px; color: rgba(255,255,255,.4); }
    body.light .release-date-text { color: rgba(0,0,0,.4); }
    .release-intro-box { font-size: 15px; line-height: 1.6; color: rgba(255,255,255,.85); margin-bottom: 16px; text-align: center; }
    body.light .release-intro-box { color: rgba(0,0,0,.85); }
    .release-block { margin-bottom: 20px; text-align: center; }
    .release-block-body { font-size: 15px; line-height: 1.6; color: rgba(255,255,255,.75); white-space: pre-line; }
    body.light .release-block-body { color: rgba(0,0,0,.75); }
    .release-actions { display: flex; gap: 12px; align-items: center; justify-content: center; flex-wrap: wrap; margin-top: 24px; }
    .missing-build-box { padding: 16px; border-radius: 16px; background: rgba(255,77,48,.1); border: 1px solid rgba(255,77,48,.25); color: #ff4d30; font-size: 14px; text-align: center; margin-bottom: 16px; }

    /* Developers section with real local avatars */
    .developers-grid { display: grid; grid-template-columns: 1fr; gap: 24px; max-width: 900px; margin: 0 auto; }
    @media (min-width: 640px) { .developers-grid { grid-template-columns: repeat(2, 1fr); } }
    .developer-card { border: 1px solid rgba(255,255,255,.08); background: rgba(255,255,255,.03); border-radius: 24px; padding: 24px; display: flex; flex-direction: column; align-items: center; text-align: center; transition: all .3s; }
    body.light .developer-card { border-color: rgba(0,0,0,.1); background: #fff; box-shadow: 0 4px 16px rgba(0,0,0,.04); }
    .developer-card:hover { border-color: rgba(255,77,48,.4); transform: translateY(-4px); }
    .dev-avatar-wrapper { width: 68px; height: 68px; border-radius: 50%; overflow: hidden; border: 2px solid rgba(255,77,48,.4); margin-bottom: 12px; background: rgba(255,255,255,.06); display: flex; align-items: center; justify-content: center; color: #ff4d30; font-weight: 700; font-size: 20px; }
    .dev-avatar-wrapper img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .dev-name { font-size: 20px; font-weight: 700; margin-bottom: 4px; color: inherit; }
    .dev-desc { font-size: 14px; color: rgba(255,255,255,.6); margin-bottom: 20px; line-height: 1.5; }
    body.light .dev-desc { color: rgba(0,0,0,.6); }
    .dev-actions-group { display: flex; align-items: center; gap: 10px; margin-top: auto; }
    .dev-profile-btn { padding: 8px 16px; border-radius: 9999px; font-size: 12px; font-weight: 600; background: #ff4d30; color: #fff; text-decoration: none; box-shadow: 0 4px 12px rgba(255,77,48,.25); transition: all .2s; }
    .dev-profile-btn:hover { background: #e0442b; transform: translateY(-2px); }
    .dev-tg-btn { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(255,255,255,.2); color: inherit; text-decoration: none; transition: all .2s; }
    body.light .dev-tg-btn { border-color: rgba(0,0,0,.2); }
    .dev-tg-btn:hover { border-color: #ff4d30; color: #ff4d30; background: rgba(255,77,48,.05); }
    .footer { display: flex; justify-content: center; align-items: center; padding-top: 32px; border-top: 1px solid rgba(255,255,255,.06); margin-top: 64px; }
    body.light .footer { border-top-color: rgba(0,0,0,.1); }
    .footer-link { font-size: 15px; font-weight: 500; text-decoration: none; color: rgba(255,255,255,.3); transition: color .2s; }
    body.light .footer-link { color: rgba(0,0,0,.4); }
    .footer-link:hover { color: #ff4d30; }
  </style>
</head>

    // Helper: Parse Project .txt format
    function parseProjectTxt(text) {
      const lines = text.split(/\r?\n/);
      const data = {};
      let currentKey = null;
      let currentVal = [];

      const KNOWN_KEYS = [
        'name', 'g-svg', 'text', 'red', 'github', 'authors',
        'about-ru-1', 'about-en-1', 'about-ru-2', 'about-en-2',
        'start-data', 'start-date'
      ];

      for (let i = 0; i < lines.length; i++) {
        const rawLine = lines[i];
        const match = rawLine.match(/^([A-Za-z0-9_\-]+)\s*:\s*(.*)$/);
        if (match && KNOWN_KEYS.includes(match[1].toLowerCase())) {
          if (currentKey) {
            data[currentKey] = currentVal.join('\n').trim();
          }
          currentKey = match[1].toLowerCase();
          currentVal = match[2] ? [match[2]] : [];
        } else {
          if (currentKey) {
            currentVal.push(rawLine);
          }
        }
      }
      if (currentKey) {
        data[currentKey] = currentVal.join('\n').trim();
      }
      return data;
    }

    function parseAuthors(str) {

    function parseDate(str) {
      if (!str) return new Date('2026-06-01T00:00:00');
      str = str.trim();
      const dmy = str.match(/^(\d{1,2})[\.\/](\d{1,2})[\.\/](\d{4})/);
      if (dmy) {
        return new Date(parseInt(dmy[3], 10), parseInt(dmy[2], 10) - 1, parseInt(dmy[1], 10));
      }
      const ymd = str.match(/^(\d{4})[\-\.\/](\d{1,2})[\-\.\/](\d{1,2})/);
      if (ymd) {
        return new Date(parseInt(ymd[1], 10), parseInt(ymd[2], 10) - 1, parseInt(ymd[3], 10));
      }
      const d = new Date(str);
      return isNaN(d.getTime()) ? new Date('2026-06-01T00:00:00') : d;
    }

    function checkImage(url) {
      return new Promise((resolve) => {

      });
    }

    // Release parser functions
    function splitBilingual(text, lang) {
      if (!text) return '';
      let t = text.trim().replace(/^#+\s*/, '').replace(/^[\*\-\•]\s*/, '').trim();
      const lines = t.split('\n').map(l => l.trim()).filter(Boolean);
      if (lines.length === 0) return '';
      if (lines.length === 1) return lines[0];
      const hasCyr = /[а-яёА-ЯЁ]/.test(lines[0]);
      if (hasCyr) {
        return lang === 'ru' ? lines[0] : lines.slice(1).join('\n');
      }
      return lang === 'en' ? lines[0] : lines.slice(1).join('\n');
    }

    function parseReleaseData(release) {
      const body = release.body || '';
      const platformMap = {};
      const sections = body.split(/(?=\[[A-Z0-9_\-]+\])/i);
      let leadText = '';

      sections.forEach(sec => {
        const match = sec.match(/^\[([A-Z0-9_\-]+)\]([\s\S]*)$/i);
        if (match) {
          const rawKey = match[1].toLowerCase();
          const content = match[2].trim();
          
          let key = rawKey;
          if (rawKey === 'pc-manjaro' || rawKey === 'pc-arch' || rawKey === 'pc-deb' || rawKey === 'linux') key = 'pc-linux';
          if (rawKey === 'pc-mac' || rawKey === 'macos') key = 'pc-macos';
          if (rawKey === 'multi-web' || rawKey === 'web') key = 'multi-html';
          if (rawKey === 'multi-archive' || rawKey === 'multi-portable' || rawKey === 'site') key = 'multi-site';

          platformMap[key] = {
            ru: splitBilingual(content, 'ru'),
            en: splitBilingual(content, 'en')
          };
        } else if (!leadText) {
          leadText = sec.trim();
        }
      });

      return {
        lead: {
          ru: splitBilingual(leadText, 'ru'),
          en: splitBilingual(leadText, 'en')
        },
        sections: platformMap
      };
    }

    function findAssetForType(release, typeId) {
      if (!release.assets || !release.assets.length) return null;
      const patterns = {
        android: [/\.apk$/i, /\.aab$/i],
        ios: [/\.ipa$/i],
        windows: [/\.exe$/i, /\.msi$/i, /win.*\.zip$/i],
        macos: [/\.dmg$/i, /\.pkg$/i, /mac.*\.zip$/i, /\.app\.zip$/i],
        linux: [/\.AppImage$/i, /\.deb$/i, /\.rpm$/i, /\.mn$/i, /\.pkg\.tar/i, /linux.*\.tar\.gz$/i],
        site: [/site.*\.zip$/i, /archive.*\.zip$/i, /web.*\.zip$/i, /portable.*\.zip$/i],
        html: [/\.html$/i, /\.htm$/i]
      };
      const typePatterns = patterns[typeId] || [];
      for (const pat of typePatterns) {
        const found = release.assets.find(a => pat.test(a.name));
        if (found) return found;
      }
      return null;
    }

    function hasContentForType(release, platformId, typeId) {
      const parsed = parseReleaseData(release);
      const key = `${platformId}-${typeId}`.toLowerCase();
      const hasSec = Boolean(parsed.sections[key] && (parsed.sections[key].ru || parsed.sections[key].en));
      const hasAsset = Boolean(findAssetForType(release, typeId));
      return hasSec || hasAsset;
    }

    function hasContentForPlatform(releasesList, platformId) {
      const plat = PLATFORMS_CONFIG.find(p => p.id === platformId);
      if (!plat) return false;
      return releasesList.some(rel => plat.types.some(t => hasContentForType(rel, platformId, t.id)));
    }

      document.body.className = th === 'light' ? 'light' : '';
      const moon = document.getElementById('themeIconMoon');
      const sun = document.getElementById('themeIconSun');
      if (th === 'light') {
        moon.style.display = 'none';
        sun.style.display = 'block';
      } else {
        moon.style.display = 'block';
        sun.style.display = 'none';
      }
    }

    function updateHeroTitle() {
      const gWrap = document.getElementById('heroTitleGWrap');
      const titleText = document.getElementById('heroTitleText');
      const titleRed = document.getElementById('heroTitleRed');
      const isGSvg = (activeProjectData['g-svg'] || 'yes').toLowerCase() === 'yes';

      if (isGSvg) {
        gWrap.style.display = 'inline-flex';
        titleText.textContent = (activeProjectData.text || 'reat User') + ' ';
        titleRed.textContent = activeProjectData.red || 'Team';
      } else {
        gWrap.style.display = 'none';
        titleText.textContent = (activeProjectData.name || activeProjectData.text || 'GUS') + ' ';
        titleRed.textContent = activeProjectData.red || '';
      }
    }

    function applyTranslations() {
      const t = TRANSLATIONS[currentLang];
      document.title = (activeProjectData.name || 'Great User System') + ' · GUT';
      document.getElementById('headerLangToggle').textContent = currentLang.toUpperCase();
      document.getElementById('heroMotto').textContent = t.brandMotto;

      const heroDesc = (currentLang === 'ru' ? activeProjectData['about-ru-1'] : activeProjectData['about-en-1']) || t.heroDescFallback;
      document.getElementById('heroDesc').textContent = heroDesc;

      document.querySelector('#tabNav-about .tab-text').textContent = t.menuAbout;
      document.querySelector('#tabNav-photos .tab-text').textContent = t.menuPhotos;
      document.querySelector('#tabNav-download .tab-text').textContent = t.menuDownload;
      document.querySelector('#tabNav-developers .tab-text').textContent = t.menuDevelopers;

      document.getElementById('aboutInfoTitle').textContent = t.aboutInfo;
      document.getElementById('photosInfoTitle').textContent = t.photosInfo;
      document.getElementById('downloadInfoTitle').textContent = t.downloadInfo;
      document.getElementById('developersInfoTitle').textContent = t.developersInfo;

      const projName = activeProjectData.name || 'Project';
      document.getElementById('daysCounterLabel').textContent = currentLang === 'ru' ? `Дней ${projName}` : `${projName} Days`;
      document.getElementById('devsCounterLabel').textContent = t.developersLabel;
      document.getElementById('releasesCounterLabel').textContent = t.releasesLabel;

      document.getElementById('btnGoPhotos').textContent = t.viewPhotosBtn;
      document.getElementById('btnGoReleases').textContent = t.releasesBtn;
      document.getElementById('btnPhotosToReleases').textContent = t.releasesBtn;
      document.getElementById('githubReleasesLinkText').textContent = t.githubReleasesBtn;
      document.getElementById('aboutGUTLinkText').textContent = t.aboutGUT;

      document.getElementById('platformFilterTitle').textContent = t.platform;
      document.getElementById('typeFilterTitle').textContent = t.type;

      renderAboutTab();
      renderPhotosTab();
      renderDevelopersTab();
      renderReleasesFilters();
      renderReleases();
    }

    function switchTab(tabKey) {
      currentTab = tabKey;
      localStorage.setItem('gut_active_tab', tabKey);

      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('data-tab') === tabKey);
      });
      document.querySelectorAll('.tab-pane').forEach(pane => {
        pane.classList.toggle('active', pane.id === `tabContent-${tabKey}`);
      });
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderAboutTab() {
      const box = document.getElementById('aboutTextBox');
      box.innerHTML = '';
      const rawText = (currentLang === 'ru' ? activeProjectData['about-ru-2'] : activeProjectData['about-en-2']) || '';
      const paragraphs = rawText.split(/\n\s*\n/).map(p => p.trim()).filter(Boolean);

      if (paragraphs.length === 0) {
        const p = document.createElement('p');
        p.textContent = currentLang === 'ru' ? 'Информация о проекте готовится к публикации.' : 'Project information is being prepared.';
        box.appendChild(p);
      } else {
        paragraphs.forEach(paragraph => {
          const p = document.createElement('p');
          p.textContent = paragraph;
          box.appendChild(p);
        });
      }
    }

    function renderPhotosTab() {
      const container = document.getElementById('photosGrid');
      container.innerHTML = '';

      if (!loadedPhotos || loadedPhotos.length === 0) {
        const errBox = document.createElement('div');
        errBox.className = 'media-error-box';
        errBox.innerHTML = `
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <circle cx="8.5" cy="8.5" r="1.5"></circle>
            <line x1="21" y1="21" x2="9" y2="9"></line>
            <line x1="3" y1="3" x2="21" y2="21"></line>
          </svg>
          <div class="media-error-text">${TRANSLATIONS[currentLang].mediaError}</div>
        `;
        container.appendChild(errBox);
        return;
      }

      loadedPhotos.forEach((src) => {
        const card = document.createElement('div');
        card.className = 'photo-card';
        card.innerHTML = `
          <img src="${src}" alt="" loading="lazy" decoding="async">
          <div class="photo-overlay">
            <svg class="photo-maximize-icon" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="15 3 21 3 21 9"></polyline>
              <polyline points="9 21 3 21 3 15"></polyline>
              <line x1="21" y1="3" x2="14" y2="10"></line>
              <line x1="3" y1="21" x2="10" y2="14"></line>
            </svg>
          </div>
        `;
        card.addEventListener('click', () => openLightbox(src));
        container.appendChild(card);
      });
    }

    // Developers Tab: REAL LOCAL AVATARS ONLY (data/avatars/)
    function renderDevelopersTab() {
      const container = document.getElementById('developersGrid');
      container.innerHTML = '';
      const t = TRANSLATIONS[currentLang];

      creatorsList.forEach(creator => {
        const card = document.createElement('div');
        card.className = 'developer-card';

        const bio = (creator.translations && creator.translations[currentLang] && creator.translations[currentLang].about)
          || (creator.translations && creator.translations.ru && creator.translations.ru.about)
          || t.devRoleFallback;

        const profileUrl = `https://greatuserteam.github.io/GUSite/creator.html?id=${creator.id || creator.slug || '1-Tigran'}`;
        const tgUrl = creator.telegram || 'https://t.me/TigranKrapivin';

        // Local avatar only from data/avatars/<slug>.jpg
        const avatarSrc = `data/avatars/${creator.slug}.jpg`;
        const initial = (creator.name || 'D').charAt(0).toUpperCase();

        card.innerHTML = `
          <div class="dev-avatar-wrapper" id="avatarWrap-${creator.slug}">
            <img src="${avatarSrc}" alt="${creator.name}" onerror="this.onerror=null;this.style.display='none';this.parentElement.textContent='${initial}'" loading="lazy" decoding="async">
          </div>
          <h3 class="dev-name">${creator.name}</h3>
          <p class="dev-desc">${bio}</p>
          <div class="dev-actions-group">
            <a href="${profileUrl}" target="_blank" rel="noopener noreferrer" class="dev-profile-btn">${t.profile}</a>
            <a href="${tgUrl}" target="_blank" rel="noopener noreferrer" class="dev-tg-btn" aria-label="Telegram">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 00-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.75-.55 2.92-1.27 4.86-2.11 5.83-2.51 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .38z"/>
              </svg>
            </a>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function renderReleasesFilters() {
      const platContainer = document.getElementById('platformFilterButtons');
      const typeContainer = document.getElementById('typeFilterButtons');
      platContainer.innerHTML = '';
      typeContainer.innerHTML = '';

      PLATFORMS_CONFIG.forEach(plat => {
        const btn = document.createElement('button');
        btn.className = `filter-btn ${plat.id === currentPlatform ? 'active' : ''}`;
        btn.textContent = plat.label[currentLang] || plat.label.ru;

        if (hasContentForPlatform(rawReleases, plat.id)) {
          const dot = document.createElement('span');
          dot.className = 'blue-indicator-dot';
          btn.appendChild(dot);
        }

        btn.addEventListener('click', () => {
          currentPlatform = plat.id;
          currentType = plat.types[0].id;
          renderReleasesFilters();
          renderReleases();
        });
        platContainer.appendChild(btn);
      });

      const activePlatObj = PLATFORMS_CONFIG.find(p => p.id === currentPlatform) || PLATFORMS_CONFIG[0];
      activePlatObj.types.forEach(type => {
        const btn = document.createElement('button');
        btn.className = `filter-btn ${type.id === currentType ? 'active' : ''}`;
        btn.textContent = type.label[currentLang] || type.label.ru;

        const hasTypeBuild = rawReleases.some(rel => hasContentForType(rel, currentPlatform, type.id));
        if (hasTypeBuild) {
          const dot = document.createElement('span');
          dot.className = 'blue-indicator-dot';
          btn.appendChild(dot);
        }

        btn.addEventListener('click', () => {
          currentType = type.id;
          renderReleasesFilters();
          renderReleases();
        });
        typeContainer.appendChild(btn);
      });
    }

    function renderReleases() {
      const container = document.getElementById('releasesList');
      container.innerHTML = '';
      const t = TRANSLATIONS[currentLang];
      const activePlatObj = PLATFORMS_CONFIG.find(p => p.id === currentPlatform) || PLATFORMS_CONFIG[0];
      const activeTypeObj = activePlatObj.types.find(tp => tp.id === currentType) || activePlatObj.types[0];
      const typeLabel = activeTypeObj.label[currentLang] || activeTypeObj.label.ru;

      rawReleases.forEach(release => {
        const parsed = parseReleaseData(release);
        const secKey = `${currentPlatform}-${currentType}`.toLowerCase();
        const sectionContent = parsed.sections[secKey] ? parsed.sections[secKey][currentLang] : '';
        const asset = findAssetForType(release, currentType);

        const card = document.createElement('div');
        card.className = 'release-item-card';

        const dateStr = release.published_at
          ? new Date(release.published_at).toLocaleDateString(currentLang === 'ru' ? 'ru-RU' : 'en-US', { year: 'numeric', month: 'long', day: 'numeric' })
          : '';

        let innerHTML = `
          <div class="release-top-bar">
            <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
              <span class="tag-badge">${release.tag_name || 'v1.0.0'}</span>
              <span class="release-main-title">${release.name || release.tag_name || 'Release'}</span>
            </div>
            <span class="release-date-text">${dateStr}</span>
          </div>
        `;

        if (parsed.lead[currentLang]) {
          innerHTML += `<div class="release-intro-box">${parsed.lead[currentLang]}</div>`;
        }

        if (sectionContent) {
          innerHTML += `
            <div class="release-block">
              <div class="release-block-body">${sectionContent}</div>
            </div>
          `;
        } else if (!asset) {
          innerHTML += `<div class="missing-build-box">${t.noBuild(typeLabel)}</div>`;
        }

        innerHTML += `<div class="release-actions">`;
        if (asset && asset.browser_download_url) {
          innerHTML += `
            <a href="${asset.browser_download_url}" target="_blank" rel="noopener noreferrer" class="btn-pill btn-pill-primary">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
              <span>${t.download} (${asset.name})</span>
            </a>
          `;
        }
        innerHTML += `
          <a href="${release.html_url}" target="_blank" rel="noopener noreferrer" class="btn-pill btn-pill-secondary">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
            <span>${t.viewRelease}</span>
          </a>
        </div>`;

        card.innerHTML = innerHTML;
        container.appendChild(card);
      });
    }

    // Lightbox modal logic
    const lightboxModal = document.getElementById('lightboxModal');
    const lightboxImg = document.getElementById('lightboxImg');
    const lightboxCloseBtn = document.getElementById('lightboxCloseBtn');

    function openLightbox(src) {
      lightboxImg.src = src;
      lightboxImg.classList.remove('zoomed');
      lightboxModal.classList.add('active');
    }

    function closeLightbox() {
      lightboxModal.classList.remove('active');
      lightboxImg.src = '';
    }

    lightboxCloseBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      closeLightbox();
    });

    lightboxModal.addEventListener('click', (e) => {
      if (e.target === lightboxModal) closeLightbox();
    });

    lightboxImg.addEventListener('click', (e) => {
      e.stopPropagation();
      lightboxImg.classList.toggle('zoomed');
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && lightboxModal.classList.contains('active')) {
        closeLightbox();
      }
    });

    // Load project data by parameter (?id=1 / ?id=2 / ?id=3)
    async function loadProjectData() {
      const params = new URLSearchParams(window.location.search);
      const idParam = params.get('id') || '1';
      activeProjectSlug = KNOWN_PROJECTS[idParam] || idParam;

      const txtUrl = `data/projects/${activeProjectSlug}.txt`;
      try {
        const res = await fetch(txtUrl);
        if (res.ok) {
          const txt = await res.text();
          const parsed = parseProjectTxt(txt);
          activeProjectData = { ...activeProjectData, ...parsed };
        }
      } catch (err) {
        console.warn('Could not load project text from server, using embedded default:', err);
      }

      updateHeroTitle();

      const ghLink = activeProjectData.github || 'https://github.com/GreatUserSystem/noname';
      document.getElementById('githubReleasesLink').href = ghLink.endsWith('/releases') ? ghLink : `${ghLink}/releases`;

      const startDateStr = activeProjectData['start-data'] || activeProjectData['start-date'] || '01.06.2026';
      const startDate = parseDate(startDateStr);
      const now = new Date();
      const diffDays = Math.max(0, Math.floor((now.getTime() - startDate.getTime()) / (1000 * 60 * 60 * 24)));
      document.getElementById('daysCounter').textContent = String(diffDays);

      const authorIds = parseAuthors(activeProjectData.authors);
      document.getElementById('devsCounter').textContent = String(authorIds.length || 2);

      creatorsList = [];
      for (const id of authorIds) {
        const creatorSlug = KNOWN_CREATORS[id] || id;
        try {
          const res = await fetch(`data/creators/${creatorSlug}.json`);
          if (res.ok) {
            const cData = await res.json();
            creatorsList.push({ ...cData, id, slug: creatorSlug });
            continue;
          }
        } catch (e) {}

        if (CREATORS_FALLBACK[creatorSlug]) {
          creatorsList.push({ ...CREATORS_FALLBACK[creatorSlug], id, slug: creatorSlug });
        } else {
          creatorsList.push({
            name: `Developer ${id}`,
            id,
            slug: creatorSlug,
            telegram: 'https://t.me/TigranKrapivin',
            translations: { ru: { about: 'Разработчик команды GUT' }, en: { about: 'GUT team developer' } }
          });
        }
      }

      // Load Photos from data/photos/project/<slug>/
      const numPrefix = activeProjectSlug.split('-')[0] || '1';
      const candidates = [
        `data/photos/project/${activeProjectSlug}/${numPrefix}.0.jpg`,
        `data/photos/project/${activeProjectSlug}/${numPrefix}.1.jpg`,
        `data/photos/project/${activeProjectSlug}/${numPrefix}.2.jpg`,
        `data/photos/project/${activeProjectSlug}/${numPrefix}.3.jpg`,
        `data/photos/project/${activeProjectSlug}/1.jpg`,
        `data/photos/project/${activeProjectSlug}/2.jpg`
      ];

      loadedPhotos = [];
      for (const url of candidates) {
        const valid = await checkImage(url);
        if (valid && !loadedPhotos.includes(valid)) {
          loadedPhotos.push(valid);
        }
      }

      fetchGitHubReleases(ghLink);
    }

    async function fetchGitHubReleases(repoUrl) {
      if (!repoUrl) return;
      try {
        const clean = repoUrl.replace(/\/releases\/?$/, '').replace(/\/$/, '');
        const match = clean.match(/github\.com\/([^\/]+)\/([^\/]+)/);
        if (match) {
          const owner = match[1];
          const repo = match[2];
          const apiUrl = `https://api.github.com/repos/${owner}/${repo}/releases`;
          const ctrl = new AbortController();
          const timer = setTimeout(() => ctrl.abort(), 4000);
          const res = await fetch(apiUrl, { signal: ctrl.signal });
          clearTimeout(timer);
          if (res.ok) {
            const data = await res.json();
            if (Array.isArray(data) && data.length > 0) {
              rawReleases = data;
              document.getElementById('releasesCounter').textContent = String(rawReleases.length);
              renderReleasesFilters();
              renderReleases();
              return;
            }
          }
        }
      } catch (e) {
        console.warn('Could not fetch releases from GitHub API, using fallback:', e);
      }
      document.getElementById('releasesCounter').textContent = String(rawReleases.length);
      renderReleasesFilters();
      renderReleases();
    }

    function initEvents() {
      const widget = document.getElementById('headerSettingsWidget');
      const trigger = document.getElementById('headerSettingsTrigger');
      trigger.addEventListener('click', (e) => {
        e.stopPropagation();
        isSettingsOpen = !isSettingsOpen;
        widget.classList.toggle('open', isSettingsOpen);
      });

      document.addEventListener('click', (e) => {
        if (isSettingsOpen && !widget.contains(e.target)) {
          isSettingsOpen = false;
          widget.classList.remove('open');
        }
      });

      document.getElementById('headerLangToggle').addEventListener('click', () => {
        currentLang = currentLang === 'ru' ? 'en' : 'ru';
        localStorage.setItem('gut_lang', currentLang);
        applyTranslations();
      });

      document.getElementById('headerThemeToggle').addEventListener('click', () => {
        applyTheme(currentTheme === 'dark' ? 'light' : 'dark');
      });

      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          switchTab(btn.getAttribute('data-tab'));
        });
      });

      document.getElementById('btnGoPhotos').addEventListener('click', () => switchTab('photos'));
      document.getElementById('btnGoReleases').addEventListener('click', () => switchTab('download'));
      document.getElementById('btnPhotosToReleases').addEventListener('click', () => switchTab('download'));
    }

    window.addEventListener('DOMContentLoaded', async () => {
      applyTheme(currentTheme);
      initEvents();
      await loadProjectData();
      applyTranslations();
      switchTab(currentTab);
    });
  </script>
