<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>GUS Project</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { scrollbar-width: none; -ms-overflow-style: none; }
    ::-webkit-scrollbar { display: none; }
    body { background: #0b0b0b; color: #f0f0f0; font-family: "Inter", system-ui, -apple-system, sans-serif; min-height: 100vh; transition: background .3s, color .3s; overflow-x: hidden; }
    body.light { background: #fff; color: #000; }
    .header { position: fixed; top: 0; left: 0; width: 100%; z-index: 50; padding: 16px 24px; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); background: rgba(11,11,11,.8); border-bottom: 1px solid rgba(255,255,255,.1); transition: all .3s; }
    body.light .header { background: rgba(255,255,255,.9); border-bottom-color: rgba(0,0,0,.1); }
    .header-inner { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
    .brand-logo { display: flex; align-items: center; font-size: 26px; font-weight: 800; letter-spacing: -.02em; text-decoration: none; color: #fff; }
    body.light .brand-logo { color: #000; }
    .brand-g { height: .85em; width: auto; margin-right: -2px; transform: translateY(1px); }
    .svg-white { fill: #fff; transition: fill .3s; }
    body.light .svg-white { fill: #000; }
    .brand-t { color: #ff4d30; margin-left: 2px; }
    .settings-widget { position: relative; border-radius: 9999px; height: 40px; width: 40px; transition: width .3s cubic-bezier(.4,0,.2,1); display: flex; align-items: center; justify-content: center; overflow: hidden; border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.05); }
    body.light .settings-widget { border-color: rgba(0,0,0,.1); background: rgba(0,0,0,.05); }
    .settings-widget.open { width: 104px; }
    .settings-trigger { position: absolute; right: 0; top: 0; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; background: none; border: none; cursor: pointer; color: inherit; transition: transform .3s, opacity .2s; z-index: 10; }
    .settings-trigger:hover { color: #ff4d30; }
    .settings-widget.open .settings-trigger { opacity: 0; pointer-events: none; transform: rotate(90deg); }
    .settings-menu { display: flex; align-items: center; justify-content: space-around; width: 100%; padding: 0 4px; opacity: 0; transform: scale(.9); pointer-events: none; transition: all .25s; }
    .settings-widget.open .settings-menu { opacity: 1; transform: scale(1); pointer-events: auto; }
    .settings-btn { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: none; border: none; cursor: pointer; font-weight: 700; font-size: 12px; color: inherit; transition: all .2s; }
    .settings-btn:hover { background: rgba(255,77,48,.15); color: #ff4d30; }
    .wrapper { max-width: 1200px; margin: 0 auto; padding: 112px 16px 64px; }
    @media (min-width: 768px) { .wrapper { padding-left: 32px; padding-right: 32px; } }
    .hero { display: flex; flex-direction: column; align-items: center; text-align: center; margin-top: 16px; margin-bottom: 32px; }
    .hero-title { font-size: clamp(34px, 5.5vw, 64px); font-weight: 800; letter-spacing: -.03em; line-height: 1.1; display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 4px; }
    .title-g { height: .9em; width: auto; margin-right: -4px; vertical-align: middle; }
    .highlight-system { color: #ff4d30; }
    .hero-motto { display: inline-flex; align-items: center; gap: 10px; padding: 12px 28px; margin-top: 20px; border-radius: 9999px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.8px; text-decoration: none; border: 1px solid rgba(255,77,48,.25); background: rgba(255,77,48,.1); color: #ff4d30; transition: all .2s; }
    body.light .hero-motto { background: rgba(0,0,0,.05); border-color: rgba(0,0,0,.15); }
    .hero-motto:hover { background: rgba(255,77,48,.2); }
    .hero-desc { margin-top: 16px; font-size: clamp(16px, 2.2vw, 19.5px); line-height: 1.6; max-width: 800px; text-align: center; color: rgba(255,255,255,.65); }
    body.light .hero-desc { color: rgba(0,0,0,.75); }
    .tabs-nav { width: 100%; max-width: 900px; margin: 0 auto 32px; display: flex; border-bottom: 1px solid rgba(255,255,255,.1); }
    body.light .tabs-nav { border-bottom-color: rgba(0,0,0,.1); }
    .tab-btn { position: relative; flex: 1; padding: 14px 4px; font-size: clamp(13px, 3.3vw, 15.5px); font-weight: 600; background: none; border: none; cursor: pointer; text-align: center; white-space: nowrap; color: rgba(255,255,255,.6); transition: color .2s; }
    body.light .tab-btn { color: rgba(0,0,0,.6); }
    .tab-btn:hover, .tab-btn.active { color: #fff; }
    body.light .tab-btn:hover, body.light .tab-btn.active { color: #000; }
    .tab-btn.active { font-weight: 700; }
    .tab-indicator { position: absolute; bottom: -1px; left: 50%; transform: translateX(-50%); width: 80%; height: 2.5px; background: #ff4d30; border-radius: 2px 2px 0 0; display: none; }
    @media (min-width: 640px) { .tab-indicator { width: 60%; } }
    .tab-btn.active .tab-indicator { display: block; }
    .tab-pane { display: none; animation: fadeIn .3s ease forwards; }
    .tab-pane.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .section-header { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 20px; }
    .section-header-icon { width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: #ff4d30; }
    .section-header-title { font-size: clamp(24px, 4vw, 28px); font-weight: 700; letter-spacing: -.02em; }
    .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; max-width: 900px; margin: 0 auto 32px; width: 100%; }
    @media (min-width: 640px) { .stats-grid { grid-template-columns: repeat(3, 1fr); gap: 16px; } }
    .stat-tile { border: 1px solid rgba(255,255,255,.08); background: rgba(255,255,255,.03); border-radius: 16px; padding: 20px 16px; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    body.light .stat-tile { border-color: rgba(0,0,0,.1); background: rgba(0,0,0,.03); box-shadow: 0 1px 3px rgba(0,0,0,.05); }
    .stat-tile.featured-mobile { grid-column: span 2; }
    @media (min-width: 640px) { .stat-tile.featured-mobile { grid-column: span 1; } }
    .stat-value { font-size: 36px; font-weight: 800; color: #ff4d30; margin-bottom: 6px; line-height: 1; }
    @media (min-width: 640px) { .stat-value { font-size: 32px; } }
    .stat-label { font-size: 12px; font-weight: 500; color: rgba(255,255,255,.5); }
    body.light .stat-label { color: rgba(0,0,0,.6); }
    .about-text-box { max-width: 900px; margin: 0 auto 24px; display: flex; flex-direction: column; gap: 16px; font-size: clamp(16px, 1.8vw, 17px); line-height: 1.7; color: rgba(255,255,255,.75); text-align: left; }
    body.light .about-text-box { color: rgba(0,0,0,.8); }
    .actions-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 24px; }
    .btn-pill { padding: 12px 24px; border-radius: 9999px; font-size: 14px; font-weight: 700; cursor: pointer; transition: all .2s; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; border: 1px solid transparent; }
    .btn-pill-primary { background: #ff4d30; color: #fff; box-shadow: 0 4px 16px rgba(255,77,48,.25); }
    .btn-pill-primary:hover { background: #e0442b; transform: translateY(-2px); }
    .btn-pill-secondary { border-color: rgba(255,255,255,.2); color: inherit; background: transparent; }
    body.light .btn-pill-secondary { border-color: rgba(0,0,0,.2); }
    .btn-pill-secondary:hover { border-color: #ff4d30; color: #ff4d30; background: rgba(255,77,48,.05); transform: translateY(-2px); }
    .photos-grid { display: grid; grid-template-columns: 1fr; gap: 20px; max-width: 1000px; margin: 0 auto; }
    @media (min-width: 640px) { .photos-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 1024px) { .photos-grid { grid-template-columns: repeat(3, 1fr); } }
    .photo-card { position: relative; border-radius: 16px; overflow: hidden; aspect-ratio: 4/3; border: 1px solid rgba(255,255,255,.08); background: rgba(255,255,255,.03); cursor: pointer; transition: all .3s; }
    body.light .photo-card { border-color: rgba(0,0,0,.1); background: rgba(0,0,0,.02); }
    .photo-card:hover { border-color: #ff4d30; transform: scale(1.02); box-shadow: 0 12px 30px rgba(0,0,0,.4); }
    .photo-card img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .5s; }
    .photo-card:hover img { transform: scale(1.06); }
    .photo-maximize-icon { position: absolute; bottom: 12px; right: 12px; width: 32px; height: 32px; border-radius: 50%; background: rgba(0,0,0,.5); color: #fff; display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity .2s; }
    .photo-card:hover .photo-maximize-icon { opacity: 1; }
    .lightbox-modal { position: fixed; inset: 0; background: rgba(0,0,0,.95); z-index: 100; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px; cursor: zoom-out; animation: fadeIn .2s forwards; }
    .lightbox-modal.active { display: flex; }
    .lightbox-close-btn { position: absolute; top: 20px; right: 20px; width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,.1); color: #fff; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all .2s; z-index: 10; }
    .lightbox-close-btn:hover { background: #ff4d30; transform: rotate(90deg); }
    .lightbox-img { max-width: 90%; max-height: 85vh; border-radius: 12px; object-fit: contain; cursor: zoom-in; transition: transform .3s; }
    .lightbox-img.zoomed { transform: scale(1.5); cursor: zoom-out; }
    .filter-card { max-width: 760px; margin: 0 auto 32px; border: 1px solid rgba(255,255,255,.08); background: rgba(255,255,255,.02); backdrop-filter: blur(12px); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
    body.light .filter-card { border-color: rgba(0,0,0,.1); background: rgba(0,0,0,.02); box-shadow: 0 1px 3px rgba(0,0,0,.05); }
    .filter-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .filter-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; width: 96px; flex-shrink: 0; color: rgba(255,255,255,.4); }
    body.light .filter-title { color: rgba(0,0,0,.5); }
    .filter-buttons-group { display: flex; gap: 8px; flex-wrap: wrap; flex: 1; }
    .filter-btn { position: relative; padding: 8px 16px; border-radius: 9999px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all .2s; border: 1px solid rgba(255,255,255,.08); background: rgba(255,255,255,.04); color: rgba(255,255,255,.7); }
    body.light .filter-btn { border-color: rgba(0,0,0,.15); background: rgba(0,0,0,.05); color: rgba(0,0,0,.8); }
    .filter-btn:hover { border-color: #ff4d30; color: #ff4d30; }
    .filter-btn.active { background: #ff4d30 !important; border-color: #ff4d30 !important; color: #fff !important; box-shadow: 0 4px 14px rgba(255,77,48,.3); }
    .blue-indicator-dot { position: absolute; top: -2px; right: -2px; width: 8px; height: 8px; background: #0088ff; border-radius: 50%; box-shadow: 0 0 8px #0088ff; pointer-events: none; }
    .releases-container { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
    .release-item-card { border: 2px solid rgba(255,255,255,.1); background: #0a0a0a; border-radius: 24px; padding: 24px; box-shadow: 0 16px 36px rgba(0,0,0,.4); transition: border-color .3s; }
    @media (min-width: 640px) { .release-item-card { padding: 28px; } }
    body.light .release-item-card { border-color: rgba(0,0,0,.1); background: #fff; box-shadow: 0 16px 36px rgba(0,0,0,.05); }
    .release-item-card:hover { border-color: rgba(255,77,48,.5); }
    .release-top-bar { display: flex; flex-direction: column; gap: 12px; padding-bottom: 16px; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,.1); }
    @media (min-width: 640px) { .release-top-bar { flex-direction: row; align-items: center; justify-content: space-between; } }
    body.light .release-top-bar { border-bottom-color: rgba(0,0,0,.1); }
    .tag-badge { padding: 4px 12px; font-size: 12px; font-weight: 700; background: rgba(255,77,48,.1); color: #ff4d30; border: 1px solid rgba(255,77,48,.25); border-radius: 9999px; align-self: flex-start; }
    .release-main-title { font-size: clamp(18px, 2.5vw, 20px); font-weight: 800; color: inherit; }
    .release-date-text { font-size: 13px; color: rgba(255,255,255,.5); font-weight: 500; }
    body.light .release-date-text { color: rgba(0,0,0,.5); }
    .lead-notes-box { background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1); border-radius: 16px; padding: 16px 20px; font-size: 15px; line-height: 1.6; margin-bottom: 20px; color: rgba(255,255,255,.8); }
    body.light .lead-notes-box { background: rgba(0,0,0,.03); border-color: rgba(0,0,0,.08); color: rgba(0,0,0,.8); }
    .section-desc-line { font-size: 15px; line-height: 1.6; margin-bottom: 12px; color: rgba(255,255,255,.8); }
    body.light .section-desc-line { color: rgba(0,0,0,.8); }
    .release-actions-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
    .dl-btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 9999px; font-size: 13px; font-weight: 600; text-decoration: none; background: #ff4d30; color: #fff; box-shadow: 0 4px 12px rgba(255,77,48,.25); transition: all .2s; }
    .dl-btn:hover { background: #e0442b; transform: translateY(-1px); }
    .link-ext-btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 9999px; font-size: 13px; font-weight: 600; text-decoration: none; border: 1px solid rgba(255,77,48,.4); color: #ff4d30; transition: all .2s; }
    .link-ext-btn:hover { background: rgba(255,77,48,.1); transform: translateY(-1px); }
    .view-gh-btn { display: inline-flex; align-items: center; gap: 6px; padding: 10px 18px; border-radius: 9999px; font-size: 13px; font-weight: 600; text-decoration: none; border: 1px solid rgba(255,255,255,.15); color: inherit; transition: all .2s; }
    body.light .view-gh-btn { border-color: rgba(0,0,0,.15); }
    .view-gh-btn:hover { border-color: #ff4d30; color: #ff4d30; }
    .missing-build-box { padding: 16px; border-radius: 16px; background: rgba(255,77,48,.1); border: 1px solid rgba(255,77,48,.25); color: #ff4d30; font-size: 14px; text-align: center; margin-bottom: 16px; }
    .media-error-box { padding: 32px; border-radius: 16px; border: 1px dashed rgba(255,77,48,.4); color: #ff4d30; font-size: 15px; font-weight: 600; text-align: center; width: 100%; grid-column: 1 / -1; }
    .developers-grid { display: grid; grid-template-columns: 1fr; gap: 24px; max-width: 900px; margin: 0 auto; }
    @media (min-width: 640px) { .developers-grid { grid-template-columns: repeat(2, 1fr); } }
    .developer-card { border: 1px solid rgba(255,255,255,.08); background: rgba(255,255,255,.03); border-radius: 24px; padding: 24px; display: flex; flex-direction: column; align-items: center; text-align: center; transition: all .3s; }
    body.light .developer-card { border-color: rgba(0,0,0,.1); background: #fff; box-shadow: 0 4px 16px rgba(0,0,0,.04); }
    .developer-card:hover { border-color: rgba(255,77,48,.4); transform: translateY(-4px); }
    .dev-avatar-wrapper { width: 64px; height: 64px; border-radius: 50%; overflow: hidden; border: 2px solid rgba(255,77,48,.4); margin-bottom: 12px; background: #1a1a1a; }
    .dev-avatar-wrapper img { width: 100%; height: 100%; object-fit: cover; }
    .dev-name { font-size: 20px; font-weight: 700; margin-bottom: 4px; color: inherit; }
    .dev-desc { font-size: 14px; color: rgba(255,255,255,.6); margin-bottom: 20px; }
    body.light .dev-desc { color: rgba(0,0,0,.6); }
    .dev-actions-group { display: flex; align-items: center; gap: 10px; margin-top: auto; }
    .dev-profile-btn { padding: 8px 16px; border-radius: 9999px; font-size: 12px; font-weight: 600; background: #ff4d30; color: #fff; text-decoration: none; box-shadow: 0 4px 12px rgba(255,77,48,.25); transition: all .2s; }
    .dev-profile-btn:hover { background: #e0442b; transform: translateY(-2px); }
    .dev-tg-btn { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(255,255,255,.2); color: inherit; text-decoration: none; transition: all .2s; }
    body.light .dev-tg-btn { border-color: rgba(0,0,0,.2); }
    .dev-tg-btn:hover { border-color: #ff4d30; color: #ff4d30; background: rgba(255,77,48,.05); }
    .footer { display: flex; justify-content: center; align-items: center; padding-top: 32px; border-top: 1px solid rgba(255,255,255,.06); margin-top: 64px; }
    body.light .footer { border-top-color: rgba(0,0,0,.1); }
    .footer-link { font-size: 15px; font-weight: 500; text-decoration: none; color: rgba(255,255,255,.3); transition: color .2s; }
    body.light .footer-link { color: rgba(0,0,0,.4); }
    .footer-link:hover { color: #ff4d30; }

    /* Ошибка 404 */
    .not-found-container { display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 64px 16px; min-height: 50vh; }
    .not-found-container.active { display: flex; }
    .not-found-code { font-size: clamp(64px, 10vw, 96px); font-weight: 800; color: #ff4d30; line-height: 1; margin-bottom: 12px; }
    .not-found-text { font-size: clamp(18px, 3vw, 24px); font-weight: 700; margin-bottom: 24px; color: rgba(255,255,255,.8); }
    body.light .not-found-text { color: rgba(0,0,0,.8); }
  </style>
</head>

  <header class="header">
    <div class="header-inner">
      <a href="index.html" class="brand-logo" id="brandLogoLink">
        <svg class="brand-g" viewBox="170 110 145 145"><use href="#gus-logo-g"/></svg><span>U</span><span class="brand-t">T</span>
      </a>

  <script>
    const PROJECT_FILES = [
      "1-GUSystem",
      "2-GUSite",
      "3-GUSCalc"
    ];

    const CREATOR_MAP = {
      "1": "1-Tigran",
      "2": "2-Merkantinez",
      "3": "3-Ratimir"
    };

    const PLATFORMS_CONFIG = [
      { id: 'mobile', label: { ru: 'Мобильные', en: 'Mobile' }, types: [
        { id: 'android', label: { ru: 'Android', en: 'Android' }, keys: ['android', 'андроид'] },
        { id: 'ios', label: { ru: 'iOS', en: 'iOS' }, keys: ['ios', 'айос', 'iphone', 'ipad', 'apple'] }
      ]},
      { id: 'pc', label: { ru: 'Компьютерные', en: 'Desktop' }, types: [
        { id: 'windows', label: { ru: 'Windows', en: 'Windows' }, keys: ['windows', 'виндовс', 'win'] },
        { id: 'macos', label: { ru: 'macOS', en: 'macOS' }, keys: ['macos', 'mac', 'макос', 'мак'] },
        { id: 'linux', label: { ru: 'Linux', en: 'Linux' }, keys: ['linux', 'линукс'] }
      ]},
      { id: 'multi', label: { ru: 'Мульти', en: 'Multi' }, types: [
        { id: 'site', label: { ru: 'Сайт', en: 'Website' }, keys: ['сайт', 'site', 'website', 'веб-сайт', 'вебсайт', 'web'] },
        { id: 'html', label: { ru: 'HTML', en: 'HTML' }, keys: ['html', 'аштмл', 'хтмл', 'веб-версия', 'вебверсия'] }
      ]}
    ];

    const TRANSLATIONS = {
      ru: {
        brandMotto: 'Проект GUT',
        menuAbout: 'О проекте', menuPhotos: 'Фото', menuDownload: 'Релизы', menuDevelopers: 'Разработчики',
        aboutInfo: 'О проекте', daysLabel: 'Дней проекта', developersLabel: 'Разработчиков', releasesLabel: 'Релизов',
        viewPhotosBtn: 'Посмотреть фото', releasesBtn: 'Релизы', photosInfo: 'Фото', downloadInfo: 'Релизы',
        developersInfo: 'Разработчики', githubReleasesBtn: 'Перейти к релизам на GitHub',
        platform: 'ПЛАТФОРМА', type: 'ТИП', download: 'Скачать', viewRelease: 'Релиз на GitHub',
        loading: 'Загрузка релизов...', noBuild: (t) => `Для типа устройства "${t}" сборка отсутствует в данном релизе.`,
        aboutGUT: 'О Great User Team', profile: 'Профиль', mediaError: 'Ошибка загрузки медиа',
        notFound: 'Такой страницы не существует', goHome: 'На главную'
      },
      en: {
        brandMotto: 'GUT Project',
        menuAbout: 'About', menuPhotos: 'Photos', menuDownload: 'Releases', menuDevelopers: 'Developers',
        aboutInfo: 'About the project', daysLabel: 'Days of Project', developersLabel: 'Developers', releasesLabel: 'Releases',
        viewPhotosBtn: 'View photos', releasesBtn: 'Releases', photosInfo: 'Photos', downloadInfo: 'Releases',
        developersInfo: 'Developers', githubReleasesBtn: 'Go to GitHub releases',
        platform: 'PLATFORM', type: 'TYPE', download: 'Download', viewRelease: 'GitHub Release',
        loading: 'Loading releases...', noBuild: (t) => `Build for device type "${t}" is missing in this release.`,
        aboutGUT: 'About Great User Team', profile: 'Profile', mediaError: 'Media loading error',
        notFound: 'This page does not exist', goHome: 'To Homepage'
      }
    };

    let currentLang = localStorage.getItem('gut_lang') || 'ru';
    let currentTheme = localStorage.getItem('gut_theme') || 'dark';
    let currentTab = localStorage.getItem('gut_active_tab') || 'about';
    let currentPlatform = 'mobile';
    let currentType = 'android';
    let rawReleases = [];
    let projectData = {};
    let projectPhotos = [];
    let developersData = [];
    let isSettingsOpen = false;

    function getProjectId() {
      const params = new URLSearchParams(window.location.search);
      return parseInt(params.get('id')) || 1;
    }

    function show404() {
      document.getElementById('mainContentBlock').style.display = 'none';
      document.getElementById('notFoundBlock').classList.add('active');
    }

    function parseProjectTxt(txt) {
      const data = {
        name: '', gSvg: false, text: '', red: '', github: '', authors: [],
        aboutRu: [], aboutEn: [], startDate: ''
      };

      const lines = txt.split('\n');
      let currentKey = null;

      lines.forEach(line => {
        const trimmed = line.trim();
        if (line.startsWith('Name:')) { data.name = line.replace('Name:', '').trim(); currentKey = null; }
        else if (line.startsWith('G-svg:')) { data.gSvg = line.replace('G-svg:', '').trim().toLowerCase() === 'yes'; currentKey = null; }
        else if (line.startsWith('Text:')) { data.text = line.replace('Text:', '').trim(); currentKey = null; }
        else if (line.startsWith('Red:')) { data.red = line.replace('Red:', '').trim(); currentKey = null; }
        else if (line.startsWith('GitHub:')) { data.github = line.replace('GitHub:', '').trim(); currentKey = null; }
        else if (line.startsWith('Authors:')) {
          const auths = line.replace('Authors:', '').replace('.', '').trim();
          data.authors = auths.split(',').map(a => a.trim()).filter(Boolean);
          currentKey = null;
        }
        else if (line.startsWith('Start-data:')) { data.startDate = line.replace('Start-data:', '').trim(); currentKey = null; }
        else if (line.match(/^About-ru-\d+:/)) {
          currentKey = 'ru';
          const val = line.replace(/^About-ru-\d+:/, '').trim();
          if (val) data.aboutRu.push(val);
        }
        else if (line.match(/^About-en-\d+:/)) {
          currentKey = 'en';
          const val = line.replace(/^About-en-\d+:/, '').trim();
          if (val) data.aboutEn.push(val);
        }
        else if (trimmed) {
          if (currentKey === 'ru') data.aboutRu.push(trimmed);
          else if (currentKey === 'en') data.aboutEn.push(trimmed);
        }
      });

      return data;
    }

    async function loadProjectData() {
      const id = getProjectId();
      const fileName = PROJECT_FILES[id - 1];

      if (!fileName) {
        show404();
        return;
      }

      try {
        const res = await fetch(`data/projects/${fileName}.txt`);
        if (!res.ok) {
          show404();
          return;
        }
        const text = await res.text();
        projectData = parseProjectTxt(text);

        renderProjectHeader();
        renderAboutTab();
        calculateDays();

        await loadProjectPhotos(fileName);
        await loadDevelopersData(projectData.authors);
        fetchGitHubReleases();

      } catch (e) {
        show404();
      }
    }

    async function loadProjectPhotos(folderName) {
      projectPhotos = [];
      let consecutiveFailures = 0;

      for (let index = 1; index <= 10; index++) {
        if (consecutiveFailures >= 2) break;
        const imgPath = `data/photos/project/${folderName}/${index}.0.jpg`;
        try {
          const res = await fetch(imgPath, { method: 'HEAD' });
          if (res.ok) {
            projectPhotos.push(imgPath);
            consecutiveFailures = 0;
          } else {
            consecutiveFailures++;
          }
        } catch (e) {
          consecutiveFailures++;
        }
      }
      renderPhotos();
    }

    async function loadDevelopersData(authorIds) {
      developersData = [];
      for (const id of authorIds) {
        const creatorFile = CREATOR_MAP[id] || `${id}-Creator`;
        try {
          const res = await fetch(`data/creators/${creatorFile}.json`);
          if (res.ok) {
            const json = await res.json();
            json.avatar = `data/avatars/${creatorFile}.jpg`;
            json.creatorFile = creatorFile;
            developersData.push(json);
          }
        } catch (e) {}
      }
      const devsEl = document.getElementById('devsCounter');
      if (devsEl) devsEl.textContent = developersData.length;
      renderDevelopersTab();
    }

    function renderProjectHeader() {
      const titleContainer = document.getElementById('heroTitleContainer');
      let html = '';
      if (projectData.gSvg) {
        html += `<span style="display:inline-flex;align-items:center;gap:2px"><svg class="title-g" viewBox="170 110 145 145"><use href="#gus-logo-g"/></svg></span>`;
      }
      html += `<span>${projectData.text || ''}</span> <span class="highlight-system">${projectData.red || ''}</span>`;
      titleContainer.innerHTML = html;

      const ghLink = document.getElementById('ghReleasesLink');
      if (ghLink) ghLink.href = projectData.github ? `${projectData.github}/releases` : '#';
    }

    function renderAboutTab() {
      const descText = currentLang === 'ru' ? (projectData.aboutRu[0] || '') : (projectData.aboutEn[0] || projectData.aboutRu[0] || '');
      document.getElementById('heroDescText').textContent = descText;

      const box = document.getElementById('aboutTextBox');
      box.innerHTML = '';
      const paragraphs = currentLang === 'ru' ? projectData.aboutRu.slice(1) : (projectData.aboutEn.slice(1).length ? projectData.aboutEn.slice(1) : projectData.aboutRu.slice(1));
      
      paragraphs.forEach(pText => {
        const p = document.createElement('p');
        p.textContent = pText;
        box.appendChild(p);
      });
    }

    function calculateDays() {
      if (!projectData.startDate) return;
      const parts = projectData.startDate.split('.');
      if (parts.length === 3) {
        const start = new Date(`${parts[2]}-${parts[1]}-${parts[0]}`);
        const now = new Date();
        const diff = Math.floor((now - start) / (1000 * 60 * 60 * 24));
        document.getElementById('daysCounter').textContent = diff > 0 ? diff : 0;
      }
    }

    function renderPhotos() {
      const grid = document.getElementById('photosGrid');
      if (!grid) return;
      grid.innerHTML = '';

      if (projectPhotos.length === 0) {
        grid.innerHTML = `<div class="media-error-box">${TRANSLATIONS[currentLang].mediaError}</div>`;
        return;
      }

      projectPhotos.forEach(src => {
        const card = document.createElement('div');
        card.className = 'photo-card';
        card.innerHTML = `<img src="${src}" alt="Media" loading="lazy" onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\\'media-error-box\\'>${TRANSLATIONS[currentLang].mediaError}</div>';"><div class="photo-maximize-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></div>`;
        card.addEventListener('click', () => {
          const img = card.querySelector('img');
          if (img && img.src) openLightbox(src);
        });
        grid.appendChild(card);
      });
    }

    function renderDevelopersTab() {
      const grid = document.getElementById('developersGrid');
      if (!grid) return;
      grid.innerHTML = '';

      developersData.forEach(dev => {
        const card = document.createElement('div');
        card.className = 'developer-card';
        const trans = dev.translations ? (dev.translations[currentLang] || dev.translations['ru']) : {};
        
        card.innerHTML = `
          <div class="dev-avatar-wrapper">
            <img src="${dev.avatar}" alt="${dev.name}" onerror="this.src='https://i.pravatar.cc/150?u=${dev.name}'" loading="lazy">
          </div>
          <h3 class="dev-name">${dev.name}</h3>
          <p class="dev-desc">${trans.about || trans.specialty || ''}</p>
          <div class="dev-actions-group">
            <a href="creator.html?id=${dev.creatorFile}" class="dev-profile-btn">${TRANSLATIONS[currentLang].profile}</a>
            ${dev.telegram ? `<a href="${dev.telegram}" target="_blank" rel="noopener noreferrer" class="dev-tg-btn" title="Telegram"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg></a>` : ''}
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function splitBilingual(text, lang) {
      if (!text) return '';
      let t = text.trim().replace(/^#+\s*/, '').replace(/^[\*\-\•]\s*/, '').trim();
      if (t.includes(' / ')) {
        const p = t.split(' / ');
        return lang === 'ru' ? p[0].trim() : (p[1] || p[0]).trim();
      }
      return t;
    }

    function matchDeviceType(headerText) {
      const clean = headerText.toLowerCase().replace(/^#+/, '').replace(/\*/g, '').trim();
      const tokens = clean.split(/[\/\s,\-|()]+/).map(t => t.trim()).filter(Boolean);
      for (const plat of PLATFORMS_CONFIG) {
        for (const dt of plat.types) {
          for (const key of dt.keys) {
            if (tokens.includes(key) || clean.includes(key)) return dt.id;
          }
        }
      }
      return null;
    }

    function parseReleaseData(release, lang) {
      const body = release.body || '';
      const lines = body.split('\n');
      const sections = {};
      const leadLines = [];
      let currentTypeKey = null;
      let bodyTitle = null;

      for (const line of lines) {
        const trimmed = line.trim();
        if (trimmed.startsWith('#')) {
          const hm = trimmed.match(/^(#+)\s*(.+)$/);
          if (hm) {
            const text = hm[2];
            const matched = matchDeviceType(text);
            if (matched) {
              currentTypeKey = matched;
              sections[currentTypeKey] = { title: text, descLines: [], links: [], files: [] };
              continue;
            } else if (!currentTypeKey && !bodyTitle) {
              bodyTitle = text.trim();
              continue;
            }
          }
        }

        if (currentTypeKey && sections[currentTypeKey]) {
          if (!trimmed || trimmed === '---' || trimmed.match(/^-{3,}$/)) continue;
          const bm = trimmed.match(/^\s*(?:[\*\-\•]\s*)?\*\*(.+?)\*\*[:\s]*(.*)$/);
          if (bm) {
            const rawLabel = bm[1].trim();
            const rawTarget = bm[2].trim();
            if (/(?:файлы|files)/i.test(rawLabel)) {
              const fileNames = rawTarget.split(',').map(f => f.trim()).filter(Boolean);
              fileNames.forEach(fn => {
                const asset = (release.assets || []).find(a => a.name.toLowerCase() === fn.toLowerCase());
                const downloadUrl = asset ? asset.browser_download_url : (release.html_url.replace('/tag/', '/download/') + '/' + fn);
                sections[currentTypeKey].files.push({ label: splitBilingual(rawLabel, lang), filename: fn, downloadUrl });
              });
              continue;
            }
            const urlMatch = rawTarget.match(/(https?:\/\/[^\s]+)/i);
            if (urlMatch) {
              sections[currentTypeKey].links.push({ label: splitBilingual(rawLabel, lang), url: urlMatch[1] });
              continue;
            }
            const fileExtMatch = rawTarget.match(/\.([a-zA-Z0-9]+)$/);
            if (fileExtMatch) {
              const asset = (release.assets || []).find(a => a.name.toLowerCase() === rawTarget.toLowerCase());
              const downloadUrl = asset ? asset.browser_download_url : (release.html_url.replace('/tag/', '/download/') + '/' + rawTarget);
              sections[currentTypeKey].files.push({ label: splitBilingual(rawLabel, lang), filename: rawTarget, downloadUrl });
              continue;
            }
            sections[currentTypeKey].descLines.push(splitBilingual(rawLabel, lang) + ': ' + splitBilingual(rawTarget, lang));
            continue;
          }
          const directUrlMatch = trimmed.match(/(https?:\/\/[^\s]+)/i);
          if (directUrlMatch) {
            const url = directUrlMatch[1].replace(/[.,;:)]+$/, '');
            const label = trimmed.replace(url, '').replace(/[\*#:-]/g, '').trim() || (lang === 'ru' ? 'Ссылка' : 'Link');
            sections[currentTypeKey].links.push({ label: splitBilingual(label, lang), url });
            continue;
          }
          sections[currentTypeKey].descLines.push(splitBilingual(trimmed, lang));
        } else {
          if (trimmed && !trimmed.startsWith('#') && !trimmed.match(/^---/)) leadLines.push(trimmed);
        }
      }

      let releaseTitle = release.name || release.tag_name;
      if (bodyTitle) releaseTitle = splitBilingual(bodyTitle, lang);

      return {
        tag: release.tag_name || 'v1.0.0',
        title: releaseTitle,
        date: release.published_at ? new Date(release.published_at).toLocaleDateString(lang === 'ru' ? 'ru-RU' : 'en-US', { year: 'numeric', month: 'long', day: 'numeric' }) : '',
        leadNotes: leadLines.map(l => splitBilingual(l, lang)).filter(Boolean),
        sections,
        htmlUrl: release.html_url
      };
    }

    function hasContentForType(releases, typeId) {
      return releases.some(rel => !!parseReleaseData(rel, 'ru').sections[typeId]);
    }

    function hasContentForPlatform(releases, platformId) {
      const plat = PLATFORMS_CONFIG.find(p => p.id === platformId);
      return plat ? plat.types.some(t => hasContentForType(releases, t.id)) : false;
    }

    function navigateToTab(tabId, toTop) {
      currentTab = tabId;
      localStorage.setItem('gut_active_tab', tabId);
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('data-tab') === tabId);
      });
      document.querySelectorAll('.tab-pane').forEach(pane => {
        pane.classList.toggle('active', pane.id === 'tabContent-' + tabId);
      });
      if (toTop) {
        requestAnimationFrame(() => {
          const nav = document.getElementById('mainTabsNav');
          const header = document.querySelector('.header');
          const headerHeight = header ? header.getBoundingClientRect().height : 70;
          let tabsTop = 0;
          if (nav) {
            const rect = nav.getBoundingClientRect();
            const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            tabsTop = Math.max(0, Math.round(rect.top + scrollTop - headerHeight));
          }
          window.scrollTo({ top: tabsTop, behavior: 'smooth' });
        });
      }
    }

    function applyTheme(theme) {
      currentTheme = theme;
      localStorage.setItem('gut_theme', theme);
      const moon = document.getElementById('themeIconMoon');
      const sun = document.getElementById('themeIconSun');
      if (theme === 'light') {
        document.body.classList.add('light');
        if (moon) moon.style.display = 'none';
        if (sun) sun.style.display = 'block';
      } else {
        document.body.classList.remove('light');
        if (moon) moon.style.display = 'block';
        if (sun) sun.style.display = 'none';
      }
    }

    function applyLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('gut_lang', lang);
      const t = TRANSLATIONS[lang];

      document.getElementById('headerLangToggle').textContent = lang.toUpperCase();
      document.getElementById('heroMottoBadge').textContent = t.brandMotto;

      document.querySelector('#tabNav-about .tab-text').textContent = t.menuAbout;
      document.querySelector('#tabNav-photos .tab-text').textContent = t.menuPhotos;
      document.querySelector('#tabNav-download .tab-text').textContent = t.menuDownload;
      document.querySelector('#tabNav-developers .tab-text').textContent = t.menuDevelopers;

      document.getElementById('aboutInfoTitle').textContent = t.aboutInfo;
      document.getElementById('aboutToPhotosBtn').textContent = t.viewPhotosBtn;
      document.getElementById('aboutToReleasesBtn').textContent = t.releasesBtn;

      document.getElementById('daysCounterLabel').textContent = t.daysLabel;
      document.getElementById('devsCounterLabel').textContent = t.developersLabel;
      document.getElementById('releasesCounterLabel').textContent = t.releasesLabel;

      document.getElementById('photosInfoTitle').textContent = t.photosInfo;
      document.getElementById('photosToReleasesBtn').textContent = t.releasesBtn;

      document.getElementById('downloadInfoTitle').textContent = t.downloadInfo;
      document.getElementById('ghReleasesLinkText').textContent = t.githubReleasesBtn;
      document.getElementById('filterLabelPlatform').textContent = t.platform;
      document.getElementById('filterLabelType').textContent = t.type;

      document.getElementById('developersInfoTitle').textContent = t.developersInfo;
      document.getElementById('aboutGUTLinkText').textContent = t.aboutGUT;

      document.getElementById('notFoundText').textContent = t.notFound;
      document.getElementById('notFoundHomeBtn').textContent = t.goHome;

      renderAboutTab();
      renderPhotos();
      renderDevelopersTab();
      renderFilters();
      renderReleases();
    }

    const lightboxModal = document.getElementById('lightboxModal');
    const lightboxImg = document.getElementById('lightboxImg');
    const lightboxCloseBtn = document.getElementById('lightboxCloseBtn');

    function openLightbox(src) {
      lightboxImg.src = src;
      lightboxImg.classList.remove('zoomed');
      lightboxModal.classList.add('active');
    }

    function closeLightbox() {
      lightboxModal.classList.remove('active');
      lightboxImg.classList.remove('zoomed');
    }

    lightboxCloseBtn.addEventListener('click', closeLightbox);
    lightboxModal.addEventListener('click', (e) => { if (e.target === lightboxModal) closeLightbox(); });
    lightboxImg.addEventListener('click', (e) => { e.stopPropagation(); lightboxImg.classList.toggle('zoomed'); });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && lightboxModal.classList.contains('active')) closeLightbox();
    });

    function renderFilters() {
      const platContainer = document.getElementById('platformFilterButtons');
      const typeContainer = document.getElementById('typeFilterButtons');
      if (!platContainer || !typeContainer) return;
      
      platContainer.innerHTML = '';
      typeContainer.innerHTML = '';

      PLATFORMS_CONFIG.forEach(plat => {
        const btn = document.createElement('button');
        btn.className = 'filter-btn ' + (plat.id === currentPlatform ? 'active' : '');
        btn.innerHTML = '<span>' + plat.label[currentLang] + '</span>';
        if (hasContentForPlatform(rawReleases, plat.id)) {
          const dot = document.createElement('span');
          dot.className = 'blue-indicator-dot';
          btn.appendChild(dot);
        }
        btn.addEventListener('click', () => {
          currentPlatform = plat.id;
          const activePlat = PLATFORMS_CONFIG.find(p => p.id === currentPlatform);
          if (activePlat && activePlat.types.length > 0) currentType = activePlat.types[0].id;
          renderFilters();
          renderReleases();
        });
        platContainer.appendChild(btn);
      });

      const activePlat = PLATFORMS_CONFIG.find(p => p.id === currentPlatform) || PLATFORMS_CONFIG[0];
      activePlat.types.forEach(typeObj => {
        const btn = document.createElement('button');
        btn.className = 'filter-btn ' + (typeObj.id === currentType ? 'active' : '');
        btn.innerHTML = '<span>' + typeObj.label[currentLang] + '</span>';
        if (hasContentForType(rawReleases, typeObj.id)) {
          const dot = document.createElement('span');
          dot.className = 'blue-indicator-dot';
          btn.appendChild(dot);
        }
        btn.addEventListener('click', () => {
          currentType = typeObj.id;
          renderFilters();
          renderReleases();
        });
        typeContainer.appendChild(btn);
      });
    }

    function renderReleases() {
      const container = document.getElementById('releasesListContainer');
      const t = TRANSLATIONS[currentLang];
      if (!container) return;
      container.innerHTML = '';

      if (!rawReleases || rawReleases.length === 0) {
        container.innerHTML = '<div class="missing-build-box">' + t.noBuild(currentType) + '</div>';
        return;
      }

      rawReleases.forEach(rel => {
        const parsed = parseReleaseData(rel, currentLang);
        const activeSection = parsed.sections[currentType];
        const activePlat = PLATFORMS_CONFIG.find(p => p.id === currentPlatform) || PLATFORMS_CONFIG[0];
        const typeObj = activePlat.types.find(to => to.id === currentType);
        const typeLabel = typeObj ? typeObj.label[currentLang] : currentType;

        const card = document.createElement('div');
        card.className = 'release-item-card';

        let leadHtml = parsed.leadNotes && parsed.leadNotes.length > 0 ? `<div class="lead-notes-box">${parsed.leadNotes.join('<br>')}</div>` : '';

        let sectionHtml = '';
        if (activeSection) {
          let descLinesHtml = activeSection.descLines && activeSection.descLines.length > 0 ? activeSection.descLines.map(d => `<div class="section-desc-line">${d}</div>`).join('') : '';

          let buttonsHtml = '';
          if (activeSection.files && activeSection.files.length > 0) {
            buttonsHtml += activeSection.files.map(f => `
              <a href="${f.downloadUrl}" target="_blank" rel="noopener noreferrer" class="dl-btn">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                <span>${f.label || t.download}: ${f.filename}</span>
              </a>
            `).join('');
          }

          if (activeSection.links && activeSection.links.length > 0) {
            buttonsHtml += activeSection.links.map(l => `
              <a href="${l.url}" target="_blank" rel="noopener noreferrer" class="link-ext-btn">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1 4-10z"></path></svg>
                <span>${l.label}</span>
              </a>
            `).join('');
          }

          buttonsHtml += `
            <a href="${parsed.htmlUrl}" target="_blank" rel="noopener noreferrer" class="view-gh-btn">
              <span>${t.viewRelease}</span>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
            </a>
          `;

          sectionHtml = descLinesHtml + '<div class="release-actions-row">' + buttonsHtml + '</div>';
        } else {
          sectionHtml = `
            <div class="missing-build-box">${t.noBuild(typeLabel)}</div>
            <div class="release-actions-row">
              <a href="${parsed.htmlUrl}" target="_blank" rel="noopener noreferrer" class="view-gh-btn">
                <span>${t.viewRelease}</span>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
              </a>
            </div>
          `;
        }

        card.innerHTML = `
          <div class="release-top-bar">
            <span class="tag-badge">${parsed.tag}</span>
            <h3 class="release-main-title">${parsed.title}</h3>
            <span class="release-date-text">${parsed.date}</span>
          </div>
          ${leadHtml}
          ${sectionHtml}
        `;
        container.appendChild(card);
      });
    }

    async function fetchGitHubReleases() {
      if (!projectData.github) return;
      const repoPath = projectData.github.replace('https://github.com/', '').replace(/\/$/, '');
      try {
        const res = await fetch(`https://api.github.com/repos/${repoPath}/releases`);
        if (!res.ok) throw new Error();
        const data = await res.json();
        if (Array.isArray(data)) rawReleases = data;
        else rawReleases = [];
      } catch (err) {
        rawReleases = [];
      }
      const counterEl = document.getElementById('releasesCounter');
      if (counterEl) counterEl.textContent = rawReleases.length;
      renderFilters();
      renderReleases();
    }

    document.addEventListener('DOMContentLoaded', () => {
      const settingsWidget = document.getElementById('headerSettingsWidget');
      const settingsTrigger = document.getElementById('headerSettingsTrigger');
      const langToggle = document.getElementById('headerLangToggle');
      const themeToggle = document.getElementById('headerThemeToggle');

      settingsTrigger.addEventListener('click', (e) => {
        e.stopPropagation();
        isSettingsOpen = !isSettingsOpen;
        settingsWidget.classList.toggle('open', isSettingsOpen);
      });

      document.addEventListener('click', (e) => {
        if (!settingsWidget.contains(e.target)) {
          isSettingsOpen = false;
          settingsWidget.classList.remove('open');
        }
      });

      langToggle.addEventListener('click', (e) => {
        e.stopPropagation();
        applyLanguage(currentLang === 'ru' ? 'en' : 'ru');
      });

      themeToggle.addEventListener('click', (e) => {
        e.stopPropagation();
        applyTheme(currentTheme === 'dark' ? 'light' : 'dark');
      });

      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          navigateToTab(btn.getAttribute('data-tab'), false);
        });
      });

      applyTheme(currentTheme);
      applyLanguage(currentLang);
      navigateToTab(currentTab, false);
      loadProjectData();
    });
  </script>
</body>
